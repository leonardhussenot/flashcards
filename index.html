<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Deutsch" />
    <meta name="theme-color" content="#F4F2ED" />
    <title>Deutsch</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <!-- MAIN MENU -->
      <section id="view-menu" class="view is-active" aria-label="Main menu">
        <div class="menu-top">
          <div class="progress-card">
            <div class="progress-header">
              <span id="deck-count" class="deck-count">0</span>
            </div>
            <div class="curve-wrap" aria-label="Knowledge distribution">
              <svg
                id="knowledge-svg"
                viewBox="0 0 320 92"
                preserveAspectRatio="none"
                role="img"
                aria-label="Distribution of card knowledge from low on the left to high on the right"
              >
                <defs>
                  <linearGradient id="curve-fill" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#1C1B19" stop-opacity="0.14" />
                    <stop offset="100%" stop-color="#1C1B19" stop-opacity="0.0" />
                  </linearGradient>
                </defs>
                <line x1="8" y1="82" x2="312" y2="82" class="curve-baseline" />
                <path id="curve-area" d="" fill="url(#curve-fill)" />
                <path id="curve-line" d="" fill="none" class="curve-stroke" />
              </svg>
              <div class="curve-axis" aria-hidden="true">
                <span>−</span>
                <span>+</span>
              </div>
            </div>
          </div>
        </div>

        <nav class="menu-actions" aria-label="Actions">
          <!-- Primary: Revise (stacked flashcards + play) -->
          <button
            id="btn-go-revise"
            class="btn btn-primary btn-hero"
            type="button"
            aria-label="Revise 20 cards"
            title="Revise"
          >
            <svg class="icon icon-lg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 5.5h11A2.5 2.5 0 0 1 20.5 8v9.5" />
              <rect x="3.5" y="7.5" width="13.5" height="11" rx="2.5" />
              <path
                d="M9.2 11.1l3.6 1.9-3.6 1.9v-3.8z"
                fill="currentColor"
                stroke="none"
              />
            </svg>
          </button>

          <div class="menu-secondary-grid">
            <!-- Add one card (single card with +) -->
            <button
              id="btn-go-add-one"
              class="btn btn-tile"
              type="button"
              aria-label="Add one card"
              title="Add one card"
            >
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="5" y="3.5" width="14" height="17" rx="2.8" />
                <path d="M12 9v6M9 12h6" />
              </svg>
            </button>

            <!-- Batch add cards (stacked list lines with +) -->
            <button
              id="btn-go-batch"
              class="btn btn-tile"
              type="button"
              aria-label="Batch add cards"
              title="Batch add cards"
            >
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h11M4 12h11M4 17h7" />
                <path d="M17.5 13.5v6M14.5 16.5h6" />
              </svg>
            </button>

            <!-- Copy AI prompt (AI sparkles, swaps to check on copy) -->
            <button
              id="btn-copy-prompt"
              class="btn btn-tile"
              type="button"
              aria-label="Copy AI extraction prompt"
              title="Copy AI prompt"
            >
              <svg
                id="icon-prompt-default"
                class="icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path
                  d="M11 3.5l1.6 4.4 4.4 1.6-4.4 1.6L11 15.5 9.4 11.1 5 9.5l4.4-1.6L11 3.5z"
                />
                <path
                  d="M18 14.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2z"
                />
              </svg>
              <svg
                id="icon-prompt-copied"
                class="icon is-gone"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path d="M5 12.5l4.5 4.5L19 7.5" />
              </svg>
            </button>
          </div>
        </nav>

        <footer class="menu-footer">
          <div id="menu-status" class="quiet-status" aria-live="polite"></div>
          <div class="backup-links">
            <button
              id="btn-export"
              class="icon-link"
              type="button"
              aria-label="Export backup JSON"
              title="Export backup"
            >
              <svg class="icon-sm" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 4v11M8 11.5l4 4 4-4" />
                <path d="M4.5 16.5v2A1.5 1.5 0 0 0 6 20h12a1.5 1.5 0 0 0 1.5-1.5v-2" />
              </svg>
            </button>
            <button
              id="btn-import"
              class="icon-link"
              type="button"
              aria-label="Import backup JSON"
              title="Import backup"
            >
              <svg class="icon-sm" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 15.5V4.5M8 8.5l4-4 4 4" />
                <path d="M4.5 16.5v2A1.5 1.5 0 0 0 6 20h12a1.5 1.5 0 0 0 1.5-1.5v-2" />
              </svg>
            </button>
            <input
              id="file-import"
              type="file"
              accept=".json,application/json"
              hidden
            />
          </div>
        </footer>
      </section>

      <!-- ADD ONE CARD -->
      <section id="view-add-one" class="view" aria-label="Add one card">
        <header class="top-bar">
          <button
            class="back-btn"
            data-go="menu"
            type="button"
            aria-label="Back to menu"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 6l-6 6 6 6" />
            </svg>
          </button>
        </header>

        <form id="form-add-one" class="panel-body" autocomplete="off">
          <div class="field">
            <label for="input-german">German</label>
            <input
              id="input-german"
              type="text"
              placeholder="e.g. der Hund"
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              enterkeyhint="next"
              required
            />
          </div>

          <div class="field">
            <label for="input-translation">Translation</label>
            <input
              id="input-translation"
              type="text"
              placeholder="e.g. le chien / the dog"
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              enterkeyhint="done"
              required
            />
          </div>

          <button
            class="btn btn-primary"
            type="submit"
            aria-label="Add card"
            title="Add card"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5.5v13M5.5 12h13" />
            </svg>
          </button>
          <p id="add-one-status" class="form-status" aria-live="polite"></p>
        </form>
      </section>

      <!-- BATCH ADD CARDS -->
      <section id="view-batch" class="view" aria-label="Batch add cards">
        <header class="top-bar">
          <button
            class="back-btn"
            data-go="menu"
            type="button"
            aria-label="Back to menu"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 6l-6 6 6 6" />
            </svg>
          </button>
        </header>

        <form id="form-batch" class="panel-body batch-body">
          <div class="field field-grow">
            <label for="input-batch">German | Translation</label>
            <textarea
              id="input-batch"
              placeholder="der Hund | the dog&#10;sich erinnern an | se souvenir de&#10;trotzdem | nevertheless"
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              required
            ></textarea>
          </div>

          <button
            class="btn btn-primary"
            type="submit"
            aria-label="Add batch cards"
            title="Add cards"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5.5v13M5.5 12h13" />
            </svg>
          </button>
          <p id="batch-status" class="form-status" aria-live="polite"></p>
        </form>
      </section>

      <!-- REVISE SESSION -->
      <section id="view-revise" class="view" aria-label="Revision session">
        <header class="top-bar">
          <button
            class="back-btn"
            data-go="menu"
            type="button"
            aria-label="Back to menu"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 6l-6 6 6 6" />
            </svg>
          </button>
          <span id="revise-counter" class="revise-counter">1 / 20</span>
        </header>

        <div class="revise-stage">
          <div
            id="flashcard"
            class="flashcard"
            role="button"
            tabindex="0"
            aria-label="Flashcard, tap to flip"
          >
            <div id="flashcard-inner" class="flashcard-inner">
              <div id="card-front" class="card-face">
                <span id="card-front-text" class="card-text"></span>
              </div>
              <div id="card-back" class="card-face card-face-back">
                <span id="card-back-text" class="card-text"></span>
              </div>
            </div>
          </div>

          <!-- Subtle Edit / Delete icons shown only once card is flipped -->
          <div id="card-tools" class="card-tools is-hidden">
            <div id="card-tools-default" class="tools-row">
              <button
                id="btn-edit-card"
                class="icon-link"
                type="button"
                aria-label="Edit card"
                title="Edit card"
              >
                <svg class="icon-sm" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M15.8 4.7l3.5 3.5L8.2 19.3l-4.2.7.7-4.2L15.8 4.7z"
                  />
                </svg>
              </button>
              <button
                id="btn-delete-card"
                class="icon-link"
                type="button"
                aria-label="Delete card"
                title="Delete card"
              >
                <svg class="icon-sm" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4.5 7h15M9.5 7V5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v2" />
                  <path d="M6.8 7l.8 11.5a1.5 1.5 0 0 0 1.5 1.5h5.8a1.5 1.5 0 0 0 1.5-1.5L17.2 7" />
                </svg>
              </button>
            </div>
            <div id="card-tools-confirm" class="tools-row is-hidden">
              <button
                id="btn-confirm-delete"
                class="icon-link danger-link"
                type="button"
                aria-label="Confirm delete"
                title="Confirm delete"
              >
                <svg class="icon-sm" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M5 12.5l4.5 4.5L19 7.5" />
                </svg>
              </button>
              <button
                id="btn-cancel-delete"
                class="icon-link"
                type="button"
                aria-label="Cancel delete"
                title="Cancel"
              >
                <svg class="icon-sm" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6.5 6.5l11 11M17.5 6.5l-11 11" />
                </svg>
              </button>
            </div>
          </div>
        </div>

        <!-- 3 Small Rating Icon Buttons: Not (✕), Approximately (~), Well (✓) -->
        <div id="rating-bar" class="rating-bar is-hidden" aria-label="Rate knowledge">
          <button
            class="rate-btn"
            data-rating="1"
            type="button"
            aria-label="Did not know"
            title="Did not know"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 7l10 10M17 7L7 17" />
            </svg>
          </button>
          <button
            class="rate-btn"
            data-rating="2"
            type="button"
            aria-label="Knew approximately"
            title="Approximately"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12.5c2-3.2 4.7-3.2 7 0s5 3.2 7 0" />
            </svg>
          </button>
          <button
            class="rate-btn"
            data-rating="3"
            type="button"
            aria-label="Knew well"
            title="Knew well"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5.5 12.5l4.2 4.2L18.5 8" />
            </svg>
          </button>
        </div>

        <!-- Minimal inline edit sheet inside revision -->
        <div id="edit-overlay" class="edit-overlay is-hidden" role="dialog" aria-modal="true">
          <form id="form-edit-card" class="edit-sheet" autocomplete="off">
            <div class="field">
              <label for="edit-german">German</label>
              <input
                id="edit-german"
                type="text"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                required
              />
            </div>
            <div class="field">
              <label for="edit-translation">Translation</label>
              <input
                id="edit-translation"
                type="text"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                required
              />
            </div>
            <div class="edit-actions">
              <button
                id="btn-cancel-edit"
                class="btn"
                type="button"
                aria-label="Cancel edit"
              >
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M7 7l10 10M17 7L7 17" />
                </svg>
              </button>
              <button
                class="btn btn-primary"
                type="submit"
                aria-label="Save card"
              >
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M5.5 12.5l4.2 4.2L18.5 8" />
                </svg>
              </button>
            </div>
          </form>
        </div>
      </section>

      <!-- SESSION COMPLETE SUMMARY -->
      <section id="view-complete" class="view" aria-label="Session summary">
        <div class="complete-wrap">
          <p id="complete-title" class="complete-title">20</p>

          <div class="summary-grid">
            <div class="summary-item" aria-label="Knew well">
              <span id="sum-well" class="summary-num">0</span>
              <svg class="icon-sm summary-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5.5 12.5l4.2 4.2L18.5 8" />
              </svg>
            </div>
            <div class="summary-item" aria-label="Approximately">
              <span id="sum-approx" class="summary-num">0</span>
              <svg class="icon-sm summary-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12.5c2-3.2 4.7-3.2 7 0s5 3.2 7 0" />
              </svg>
            </div>
            <div class="summary-item" aria-label="Did not know">
              <span id="sum-not" class="summary-num">0</span>
              <svg class="icon-sm summary-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 7l10 10M17 7L7 17" />
              </svg>
            </div>
          </div>

          <button
            id="btn-finish-session"
            class="btn btn-primary"
            type="button"
            aria-label="Back to menu"
            title="Back to menu"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 14l-4-4 4-4" />
              <path d="M5 10h10a4 4 0 0 1 0 8h-2" />
            </svg>
          </button>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
